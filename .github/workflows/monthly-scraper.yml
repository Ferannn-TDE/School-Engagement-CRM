name: Monthly School Scraper

on:
  schedule:
    - cron: "0 2 1 * *"
      timezone: "America/Chicago"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monthly-school-scraper
  cancel-in-progress: false

jobs:
  scrape-and-upsert:
    name: Scrape schools and upsert results
    runs-on: ubuntu-latest
    timeout-minutes: 360

    defaults:
      run:
        shell: bash
        working-directory: Scraper

    env:
      PYTHONUNBUFFERED: "1"
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Validate database secret
        run: |
          set -Eeuo pipefail

          if [[ -z "${DATABASE_URL:-}" ]]; then
            echo "::error::DATABASE_URL repository secret is missing."
            exit 1
          fi

          case "${DATABASE_URL}" in
            postgres://*|postgresql://*) ;;
            *)
              echo "::error::DATABASE_URL must be a PostgreSQL connection URI."
              exit 1
              ;;
          esac

      - name: Install scraper dependencies
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip
          python -m pip install --requirement requirements.txt
          python -m pip check

      - name: Verify imports and Python syntax
        run: |
          set -Eeuo pipefail
          python -c "import bs4, openpyxl, psycopg, requests, xlrd"
          python -m compileall -q .

      - name: Start a fresh monthly collection
        run: |
          set -Eeuo pipefail
          python -c "from pathlib import Path; p = Path('output'); p.mkdir(parents=True, exist_ok=True); (p / 'checkpoint.json').write_text('{}\n', encoding='utf-8')"

      - name: Run scraper and database upsert
        run: |
          set -Eeuo pipefail
          python main.py

      - name: Upload completed reports
        if: ${{ success() }}
        uses: actions/upload-artifact@v7
        with:
          name: school-scraper-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ github.workspace }}/Scraper/output/results.json
            ${{ github.workspace }}/Scraper/output/schools.json
            ${{ github.workspace }}/Scraper/output/contacts.json
            ${{ github.workspace }}/Scraper/output/events.json
            ${{ github.workspace }}/Scraper/output/iacac_events.json
            ${{ github.workspace }}/Scraper/output/contact_quality.json
            ${{ github.workspace }}/Scraper/output/review.json
          if-no-files-found: error
          retention-days: 31
          compression-level: 9
